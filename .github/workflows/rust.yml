name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: cargo build --verbose
    - name: Run doctests
      run: cargo test --doc --verbose

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov
    - name: Install nextest
      uses: taiki-e/install-action@nextest
    - name: Generate code coverage
      run: cargo llvm-cov nextest --all-features --workspace --lcov --output-path lcov.info
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4.0.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: lcov.info
        fail_ci_if_error: true

  fuzz:
    name: Fuzz build & smoke
    runs-on: ubuntu-latest
    env:
      # cargo-fuzz's pre-built release binary (via taiki-e/install-action) is
      # musl-linked, so its compile-time HOST default targets musl. Sanitizers
      # are incompatible with statically linked libc, so force the gnu target.
      FUZZ_TARGET_TRIPLE: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-15
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Build all fuzz targets
        run: cargo fuzz build --target ${{ env.FUZZ_TARGET_TRIPLE }}
      - name: Smoke-run solve_sudoku
        run: cargo fuzz run --target ${{ env.FUZZ_TARGET_TRIPLE }} solve_sudoku -- -runs=2000 -max_total_time=30
      - name: Smoke-run value_bitset
        run: cargo fuzz run --target ${{ env.FUZZ_TARGET_TRIPLE }} value_bitset -- -runs=5000 -max_total_time=30
      - name: Smoke-run game_state_ops
        run: cargo fuzz run --target ${{ env.FUZZ_TARGET_TRIPLE }} game_state_ops -- -runs=5000 -max_total_time=30
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
