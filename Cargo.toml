[package]
name = "sudoku2"
description = "Sudoku solving for fun and zero profit"
version = "0.1.0"
edition = "2021"
authors = ["Markus Mayer"]
license = "EUPL-1.2"

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "solver"
path = "examples/solver.rs"

[[example]]
name = "generate"
path = "examples/generate.rs"

[[bench]]
name = "benchmark"
harness = false

[features]
default = ["smallvec"]
smallvec = ["dep:smallvec"]
wasm = [
    "dep:getrandom",
    "dep:js-sys",
    "dep:serde",
    "dep:serde-wasm-bindgen",
    "dep:wasm-bindgen",
]

[dependencies]
getrandom = { version = "0.4.2", optional = true, features = ["wasm_js"] }
js-sys = { version = "0.3.82", optional = true }
log = "0.4.29"
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde-wasm-bindgen = { version = "0.6.5", optional = true }
smallvec = { version = "1.15.1", features = ["union"], optional = true }
thiserror = "2.0.18"
wasm-bindgen = { version = "0.2.105", optional = true }

[dev-dependencies]
clap = "4.6.1"
criterion = "0.8.2"
env_logger = "0.11.10"
