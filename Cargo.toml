[package]
name = "sudoku2"
description = "Sudoku solving for fun and zero profit"
version = "0.1.0"
edition = "2021"
authors = ["Markus Mayer"]
license = "EUPL-1.2"

[[example]]
name = "solver"
path = "examples/solver.rs"

[[bench]]
name = "benchmark"
harness = false

[features]
default = ["smallvec"]
smallvec = ["dep:smallvec"]

[dependencies]
log = "0.4.29"
rand = "0.10.1"
smallvec = { version = "1.15.1", features = ["union"], optional = true }
thiserror = "2.0.18"

[dev-dependencies]
clap = "4.6.1"
criterion = "0.8.2"
env_logger = "0.11.10"
