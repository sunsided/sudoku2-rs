version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  clean:
    desc: Remove cargo build artifacts
    cmds:
      - cargo clean

  fmt:
    desc: Format all Rust sources
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Check formatting without modifying files
    cmds:
      - cargo fmt --all -- --check

  lint:
    desc: Run clippy across the workspace (warnings as errors)
    aliases:
      - lint:check
    cmds:
      - cargo clippy --workspace --all-targets --all-features -- -D warnings

  lint:fix:
    desc: Auto-fix clippy lints, then format
    cmds:
      - cargo clippy --workspace --all-targets --all-features --fix --allow-dirty --allow-staged
      - task: fmt

  check:
    desc: Type-check the workspace without producing binaries
    cmds:
      - cargo check --workspace --all-targets
      - task: fmt:check

  build:
    desc: Build the workspace (debug profile)
    cmds:
      - cargo build --workspace --all-targets

  build:release:
    desc: Build the workspace (release profile)
    cmds:
      - cargo build --workspace --release

  test:
    desc: Run the workspace test suite
    cmds:
      - cargo test --workspace --all-targets

  test:doc:
    desc: Run doctests
    cmds:
      - cargo test --workspace --doc

  test:unique-rectangle:
    desc: Run unit tests for the Unique Rectangle strategy
    aliases:
      - test:ur
    cmds:
      - cargo test --workspace --all-targets unique_rectangle

  doc:
    desc: Build rustdoc for the workspace
    cmds:
      - cargo doc --workspace --no-deps

  doc:open:
    desc: Build and open rustdoc in browser
    cmds:
      - cargo doc --workspace --no-deps --open

  bench:
    desc: Run all benchmarks
    cmds:
      - cargo bench

  bench:baseline:
    desc: Save benchmark results as a named baseline (BASELINE=name, default is main)
    vars:
      BASELINE:
        sh: echo "${BASELINE:-main}"
    cmds:
      - cargo bench -- --save-baseline {{.BASELINE}}

  example:solver:
    desc: Run the solver example in debug mode (pass game/strategy flags via --)
    cmds:
      - cargo run --example solver -- {{.CLI_ARGS}}

  generate:
    desc: >-
      Generate a puzzle (variant, difficulty, symmetry, seed via CLI_ARGS).
      E.g.: task generate -- --variant standard --difficulty hard --seed 42
    aliases:
      - gen
    cmds:
      - cargo run --release --example generate -- {{.CLI_ARGS}}

  wasm:build:
    desc: Build the WASM web package into ./pkg (requires wasm-pack)
    preconditions:
      - sh: command -v wasm-pack >/dev/null 2>&1
        msg: >-
          wasm-pack is required for this task.
          Install it from https://rustwasm.github.io/wasm-pack/installer/
    cmds:
      - wasm-pack build --release --target web --features wasm

  wasm:demo:
    desc: Build WASM package and run a local demo web server on port 8000
    deps:
      - wasm:build
    cmds:
      - python3 -m http.server

  examples:
    desc: Run all examples
    aliases:
      - run
    cmds:
      - task: example:sudoku
      - task: example:sudoku-ht
      - task: example:sudoku-xwing
      - task: example:sudoku-skyscraper
      - task: example:sudoku-xy-wing
      - task: example:sudoku-w-wing
      - task: example:sudoku-hardest
      - task: example:sudoku-unique-rectangle
      - task: example:nonomino
      - task: example:hyper

  example:sudoku:
    desc: Run standard Sudoku example (Wikipedia puzzle)
    aliases:
      - run:sudoku
    cmds:
      - cargo run --release --example solver -- --sudoku {{.CLI_ARGS}}

  example:sudoku-ht:
    desc: Run Sudoku example with known Hidden Twins
    aliases:
      - run:sudoku-ht
    cmds:
      - cargo run --release --example solver -- --sudoku-ht {{.CLI_ARGS}}

  example:sudoku-xwing:
    desc: Run Sudoku example with known X-Wings
    aliases:
      - run:sudoku-xwing
    cmds:
      - cargo run --release --example solver -- --sudoku-xwing {{.CLI_ARGS}}

  example:sudoku-skyscraper:
    desc: Run Sudoku example with a known Skyscraper
    aliases:
      - run:sudoku-skyscraper
    cmds:
      - cargo run --release --example solver -- --sudoku-skyscraper {{.CLI_ARGS}}

  example:sudoku-xy-wing:
    desc: Run example seeded with a known XY-Wing pattern
    aliases:
      - run:sudoku-xy-wing
    cmds:
      - cargo run --release --example solver -- --sudoku-xy-wing {{.CLI_ARGS}}

  example:sudoku-w-wing:
    desc: Run example seeded with a known W-Wing pattern
    aliases:
      - run:sudoku-w-wing
    cmds:
      - cargo run --release --example solver -- --sudoku-w-wing {{.CLI_ARGS}}

  example:sudoku-hardest:
    desc: Run hardest-difficulty Sudoku example
    aliases:
      - run:sudoku-hardest
    cmds:
      - cargo run --release --example solver -- --sudoku-hardest {{.CLI_ARGS}}

  example:sudoku-unique-rectangle:
    desc: >-
      Run the hardest Sudoku example with the opt-in Unique Rectangle (Type 1)
      strategy enabled. Assumes a uniquely solvable puzzle - do not point at
      multi-solution boards.
    aliases:
      - run:sudoku-unique-rectangle
      - example:sudoku-ur
      - run:sudoku-ur
    cmds:
      - cargo run --release --example solver -- --sudoku-hardest --unique-rectangle {{.CLI_ARGS}}

  example:nonomino:
    desc: Run Nonomino example
    aliases:
      - run:nonomino
    cmds:
      - cargo run --release --example solver -- --nonomino {{.CLI_ARGS}}

  example:hyper:
    desc: Run Hypersudoku example
    aliases:
      - run:hyper
    cmds:
      - cargo run --release --example solver -- --hyper {{.CLI_ARGS}}

  ci:
    desc: Run the checks expected in CI (fmt, lint, test)
    cmds:
      - task: fmt:check
      - task: lint
      - task: test

  fuzz:list:
    desc: List available cargo-fuzz targets
    cmds:
      - cargo +nightly fuzz list

  fuzz:build:
    desc: Build all fuzz targets (nightly toolchain)
    cmds:
      - cargo +nightly fuzz build

  fuzz:run:
    desc: Run a specific fuzz target (TARGET=name, extra libFuzzer flags via --)
    vars:
      TARGET:
        sh: echo "${TARGET:-solve_sudoku}"
    cmds:
      - cargo +nightly fuzz run {{.TARGET}} -- {{.CLI_ARGS}}

  fuzz:solve:
    desc: Fuzz the default Sudoku solver against arbitrary input boards
    cmds:
      - cargo +nightly fuzz run solve_sudoku -- {{.CLI_ARGS}}

  fuzz:bitset:
    desc: Fuzz ValueBitSet operations and invariants
    cmds:
      - cargo +nightly fuzz run value_bitset -- {{.CLI_ARGS}}

  fuzz:state:
    desc: Fuzz GameState place/forget/propagate sequences
    cmds:
      - cargo +nightly fuzz run game_state_ops -- {{.CLI_ARGS}}

  fuzz:smoke:
    desc: Short smoke run of every fuzz target (10s each)
    cmds:
      - cargo +nightly fuzz run solve_sudoku -- -max_total_time=10
      - cargo +nightly fuzz run value_bitset -- -max_total_time=10
      - cargo +nightly fuzz run game_state_ops -- -max_total_time=10

  fuzz:clean:
    desc: Remove fuzz build artifacts and corpora
    cmds:
      - cargo +nightly fuzz clean
